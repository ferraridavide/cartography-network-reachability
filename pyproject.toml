[project]
name = "cartography-reachability"
version = "0.1.0"
description = "Trace AWS network reachability (security groups, routes, TGW, peering, ELB) from Cartography data in Neo4j and explore it as an interactive edge-bundling graph."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["aws", "cartography", "neo4j", "network", "reachability", "security", "visualization", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastmcp>=3.3.1",
    "neo4j>=5.26.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[project.scripts]
cartography-reachability = "cartography_reachability.cli:main"
raytrace-network-paths = "cartography_reachability.cli:export_main"
cartography-reachability-mcp = "reachability_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartography_reachability", "reachability_mcp"]
# The built frontend (bundle-frontend -> npm run build) is git-ignored but shipped in wheels.
artifacts = ["cartography_reachability/web/**"]
